server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;

    # Directory listings for pictures-svg/ pictures-jpg/ pictures-png/
    autoindex on;

    # meshviewer / firmware-selector usually fetch these cross-origin
    add_header Access-Control-Allow-Origin "*" always;

    gzip on;
    gzip_types image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
