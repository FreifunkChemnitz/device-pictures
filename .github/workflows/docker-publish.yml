---
name: Build and Publish Container

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to increase'
        type: choice
        default: minor
        options:
          - major
          - minor
          - patch
  push:
    branches:
      - main
    paths:
      - 'pictures-svg/**'
      - 'conversion-script.sh'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'conversion-script.sh'
      - '.github/workflows/docker-publish.yml'

# Never run two publishing builds at once - they would race for the same tag
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create and push the version tag + GitHub release
      packages: write    # push the image to GHCR

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # we need the full tag history to derive the next version

      - name: Determine next version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          bump="${{ github.event.inputs.bump || 'minor' }}"
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"

          if [ -z "${latest}" ]; then
            major=1; minor=0; patch=0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "${bump}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
          fi

          full="${major}.${minor}.${patch}"
          echo "tag=v${full}"            >> "$GITHUB_OUTPUT"
          echo "full=${full}"            >> "$GITHUB_OUTPUT"
          echo "minor=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "major=${major}"          >> "$GITHUB_OUTPUT"
          echo "::notice::Bumping ${latest:-<none>} -> v${full} (${bump})"

      - name: Create and push tag
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.full }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Container image:
            `docker pull ghcr.io/freifunkchemnitz/device-pictures:${{ steps.version.outputs.full }}`
